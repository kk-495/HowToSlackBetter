<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">高性价比摸鱼指南</title>
  <desc id="desc">少一点无效忙碌，多留时间、精力与边界。83 条研究支持的建议、50 项期刊研究与官方来源、A/B 证据等级。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset=".58" stop-color="#eef2ff"/><stop offset="1" stop-color="#e8f7f1"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#4567d8"/><stop offset="1" stop-color="#148263"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="9" rx="4" fill="url(#bar)"/>
  <circle cx="88" cy="77" r="24" fill="#3e5dc5"/><path d="m77 77 8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="85" fill="#465569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">高性价比摸鱼指南</text>
  <text x="82" y="190" fill="#161a24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="57" font-weight="800">少一点无效忙碌，</text>
  <text x="82" y="260" fill="#161a24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="57" font-weight="800">多留<tspan fill="#3e5dc5">时间、精力与边界</tspan></text>
  <text x="86" y="312" fill="#5d6879" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="23">注意力 · 会议 · 休假 · 数字边界 · 情绪劳动 · 工作设计</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="700">
